<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lane Racer</title>
<style>
  :root { color-scheme: dark; }
  body { font: 16px system-ui, sans-serif; background: #111; color: #ddd; margin: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; align-items: center; }
  button { font: inherit; padding: 12px 16px; border-radius: 8px; border: 1px solid #555; background: #2a2a2a; color: #eee; }
  #status { font-size: 14px; color: #aaa; }
  canvas { width: 100%; max-width: 800px; background: #000; border: 1px solid #444; display: block; }
  #log { white-space: pre-wrap; font: 12px ui-monospace, monospace; background: #000; padding: 8px; max-height: 140px; overflow: auto; }
</style>
<script>
  // Plain script so it runs even if the module below fails to load: show any error on screen.
  addEventListener('error', (e) => {
    const msg = e.message || `failed to load ${e.target?.src || e.target?.href || 'a resource'}`;
    const d = document.getElementById('fatal') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'fatal' }));
    d.style.cssText = 'background:#600;color:#fff;padding:8px;white-space:pre-wrap;font:13px monospace';
    d.textContent += msg + '\n';
  }, true);
</script>
</head>
<body>
  <div class="row">
    <button id="connect">Connect screen</button>
    <button id="connectLeds">Connect LEDs</button>
    <span id="status"></span>
  </div>
  <canvas id="canvas" width="800" height="480"></canvas>
  <p>Paddles or D-pad change lanes · right clutch boost (charges brakes) · left clutch brake (uses brake meter on the LEDs). Menus: tap the wheel screen, or D-pad + right clutch to confirm, left clutch to go back. Keyboard: arrows, Enter, typing.</p>
  <div id="log"></div>
<script type="module">
import { createGame, ledFrame } from './game.js';
import { WheelLeds, openLink } from './wheelleds.js';
import { createScreen } from './screen.js';
import { startBridge, bridgeLog } from './bridge.js';

const $ = (id) => document.getElementById(id);
const canvas = $('canvas');
const st = { screen: 'screen: not connected', leds: 'leds: not connected', bridge: '', fps: '' };
const showStatus = () => ($('status').textContent = [st.screen, st.fps, st.leds, st.bridge && `bridge: ${st.bridge}`].filter(Boolean).join(' · '));

function log(...a) {
  const line = a.map((x) => (typeof x === 'string' ? x : JSON.stringify(x))).join(' ');
  $('log').textContent += line + '\n';
  $('log').scrollTop = 1e9;
  bridgeLog(line);
}
addEventListener('error', (e) => log('error:', e.message));
addEventListener('unhandledrejection', (e) => log('error:', String(e.reason)));

const game = createGame(canvas);
const screen = createScreen(canvas, { log, onStatus: (s) => { st.screen = s; showStatus(); }, onTap: (p) => game.tap(p) });
// Clicks/taps on the page's preview canvas act like wheel-screen touches (handy on desktop).
canvas.addEventListener('pointerdown', (e) => {
  const r = canvas.getBoundingClientRect();
  game.tap({ x: ((e.clientX - r.left) / r.width) * canvas.width, y: ((e.clientY - r.top) / r.height) * canvas.height });
});
setInterval(() => { st.fps = screen.connected ? `${screen.fps.toFixed(0)} fps` : ''; showStatus(); }, 1000);

$('connect').onclick = () => screen.connect().catch((e) => log('connect failed:', e.message));

// Wheel LEDs: Web Serial on desktop, WebUSB on Android. Granted devices reopen on load.
let leds = null;
async function connectLeds(gesture) {
  try {
    const link = await openLink({ gesture });
    if (!link) return;
    leds = new WheelLeds(link, log);
    st.leds = 'leds: on'; showStatus();
  } catch (e) { log('leds failed:', e.message); st.leds = 'leds: failed'; showStatus(); }
}
$('connectLeds').onclick = () => connectLeds(true);
connectLeds(false);
setInterval(() => { if (leds && !leds.closed) leds.set(ledFrame(game.state)); }, 50);

startBridge(() => ({ game, screen, canvas, log, get leds() { return leds; } }), (s) => { st.bridge = s; showStatus(); });
window.rw = { game, screen, get leds() { return leds; } };
</script>
</body>
</html>
